name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit and HTTP tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit and domain tests
        run: php artisan test --testsuite=Unit

      - name: Run backend HTTP workflow tests
        run: php artisan test --testsuite=Feature

  frontend-tests:
    name: Frontend unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit tests
        run: npm run test:frontend

      - name: Build frontend assets
        run: npm run build

  docker-build:
    name: Verify application and web container builds
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build PHP application image
        run: docker build --target app --tag vehicle-tracking-tomeco-app:ci .

      - name: Build Nginx web image
        run: docker build --target web --tag vehicle-tracking-tomeco-web:ci .
